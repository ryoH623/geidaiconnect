name: Deploy to ConoHa (FTPS)

# main への push でビルド → ConoHa の公開ディレクトリへ FTPS で自動デプロイ。
# 手動実行もできる（Actions タブ → Run workflow）。
# ※ claude/auto-updates など main 以外への push では動かない（未レビューコードを本番へ出さないため）。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 依存関係をインストール
        run: npm ci

      - name: ビルド（Vite）
        run: npm run build
        env:
          # フロントのビルド時に埋め込まれる公開設定値（GitHub Secrets から注入）
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_TEMPLATE_ID_TEACHER: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID_TEACHER }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_GET_RESERVATION_FOR_SUCCESS_URL: ${{ secrets.VITE_GET_RESERVATION_FOR_SUCCESS_URL }}

      - name: FTPS で公開ディレクトリへ配信
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}         # 例: www1021.conoha.ne.jp
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps                            # 暗号化（明示的FTPS / ポート21）
          port: 21
          server-dir: ${{ secrets.FTP_SERVER_DIR }} # 末尾スラッシュ必須。例: /public_html/
          local-dir: ./dist/
          # 差分のみ転送。初回はサーバ上に state ファイルが無いため全件アップロードされる。
          dangerous-clean-slate: false
